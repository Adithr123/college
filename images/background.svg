<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow1" cx="20%" cy="20%" r="40%">
      <stop offset="0%" style="stop-color:#7bd389;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#7bd389;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="60%" r="35%">
      <stop offset="0%" style="stop-color:#5883ff;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#5883ff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="90%" r="30%">
      <stop offset="0%" style="stop-color:#ffc107;stop-opacity:0.04"/>
      <stop offset="100%" style="stop-color:#ffc107;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="900" fill="#0a0f16"/>
  <rect width="1440" height="900" fill="url(#glow1)"/>
  <rect width="1440" height="900" fill="url(#glow2)"/>
  <rect width="1440" height="900" fill="url(#glow3)"/>
  <!-- Subtle dot grid pattern -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="0.5" fill="#7bd389" opacity="0.08"/>
  </pattern>
  <rect width="1440" height="900" fill="url(#dots)"/>
</svg>
