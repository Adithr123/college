<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Review Slides Graphic</title>
  <desc id="desc">Three stacked slide cards showing repeated monthly charges and totals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1117"/>
      <stop offset="100%" stop-color="#101722"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="170" y="180" width="320" height="430" rx="28" fill="#121a24" stroke="#314054" stroke-width="2" transform="rotate(-6 170 180)"/>
  <rect x="440" y="150" width="360" height="470" rx="30" fill="#18202a" stroke="#314054" stroke-width="2"/>
  <rect x="730" y="190" width="300" height="410" rx="28" fill="#121a24" stroke="#314054" stroke-width="2" transform="rotate(7 730 190)"/>
  <rect x="220" y="240" width="220" height="28" rx="14" fill="#7bd389"/>
  <rect x="220" y="292" width="260" height="20" rx="10" fill="#d7e0ea" opacity="0.7"/>
  <rect x="220" y="330" width="190" height="20" rx="10" fill="#d7e0ea" opacity="0.45"/>
  <rect x="490" y="220" width="260" height="36" rx="18" fill="#34b1c3"/>
  <rect x="490" y="284" width="180" height="18" rx="9" fill="#d7e0ea" opacity="0.68"/>
  <rect x="490" y="320" width="220" height="18" rx="9" fill="#d7e0ea" opacity="0.45"/>
  <rect x="490" y="356" width="150" height="18" rx="9" fill="#d7e0ea" opacity="0.32"/>
  <rect x="780" y="260" width="180" height="28" rx="14" fill="#7bd389" opacity="0.9"/>
  <rect x="780" y="312" width="140" height="20" rx="10" fill="#d7e0ea" opacity="0.65"/>
  <rect x="780" y="350" width="160" height="20" rx="10" fill="#d7e0ea" opacity="0.45"/>
  <text x="600" y="690" text-anchor="middle" fill="#f7f7f2" font-family="Syne, Arial, sans-serif" font-size="48" font-weight="700">Repeated charges add up</text>
</svg>