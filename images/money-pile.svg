<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Money Pile Graphic</title>
  <desc id="desc">A pile of cash shrinking into smaller and smaller stacks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1117"/>
      <stop offset="100%" stop-color="#101722"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="36" fill="url(#bg)"/>
  <ellipse cx="400" cy="628" rx="220" ry="38" fill="#7bd389" opacity="0.10"/>
  <g transform="translate(160 250)">
    <rect x="0" y="220" width="480" height="70" rx="18" fill="#2ecc71"/>
    <rect x="34" y="162" width="412" height="70" rx="18" fill="#27ae60"/>
    <rect x="70" y="104" width="340" height="70" rx="18" fill="#2ecc71"/>
    <rect x="110" y="46" width="260" height="70" rx="18" fill="#27ae60"/>
    <circle cx="240" cy="260" r="60" fill="#0b1117" opacity="0.25"/>
    <text x="240" y="272" text-anchor="middle" fill="#f7f7f2" font-family="Montserrat, Arial, sans-serif" font-size="36" font-weight="800">$</text>
  </g>
</svg>