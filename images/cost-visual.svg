<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Cost Visual Graphic</title>
  <desc id="desc">A subscription price card with monthly costs and hidden fees highlighted.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1117"/>
      <stop offset="100%" stop-color="#121a24"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="180" y="140" width="840" height="520" rx="34" fill="#121a24" stroke="#314054" stroke-width="2"/>
  <rect x="250" y="210" width="320" height="200" rx="24" fill="#18202a"/>
  <text x="410" y="270" text-anchor="middle" fill="#f7f7f2" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="700">Monthly Price</text>
  <text x="410" y="340" text-anchor="middle" fill="#7bd389" font-family="Syne, Arial, sans-serif" font-size="56" font-weight="700">$12.99</text>
  <rect x="640" y="210" width="320" height="200" rx="24" fill="#18202a"/>
  <text x="800" y="270" text-anchor="middle" fill="#f7f7f2" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="700">Hidden Fee</text>
  <text x="800" y="340" text-anchor="middle" fill="#34b1c3" font-family="Syne, Arial, sans-serif" font-size="56" font-weight="700">$4.00</text>
  <rect x="250" y="470" width="710" height="64" rx="20" fill="#7bd389" opacity="0.14"/>
  <text x="605" y="511" text-anchor="middle" fill="#f7f7f2" font-family="Syne, Arial, sans-serif" font-size="34" font-weight="700">Total cost rises over time</text>
</svg>