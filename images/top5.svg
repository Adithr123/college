<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Top Five Costs Graphic</title>
  <desc id="desc">Five stacked bars comparing subscription costs against a budget line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1117"/>
      <stop offset="100%" stop-color="#101722"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="160" y="130" width="880" height="540" rx="32" fill="#121a24" stroke="#263243" stroke-width="2"/>
  <line x1="220" y1="560" x2="980" y2="560" stroke="#314054" stroke-width="4"/>
  <rect x="250" y="470" width="90" height="90" rx="16" fill="#7bd389"/>
  <rect x="380" y="400" width="90" height="160" rx="16" fill="#34b1c3"/>
  <rect x="510" y="330" width="90" height="230" rx="16" fill="#ffc15d"/>
  <rect x="640" y="260" width="90" height="300" rx="16" fill="#ff7b7b"/>
  <rect x="770" y="200" width="90" height="360" rx="16" fill="#9ba8b9"/>
  <text x="295" y="612" text-anchor="middle" fill="#d7e0ea" font-family="Montserrat, Arial, sans-serif" font-size="24">$7.99</text>
  <text x="425" y="612" text-anchor="middle" fill="#d7e0ea" font-family="Montserrat, Arial, sans-serif" font-size="24">$11.99</text>
  <text x="555" y="612" text-anchor="middle" fill="#d7e0ea" font-family="Montserrat, Arial, sans-serif" font-size="24">$15.49</text>
  <text x="685" y="612" text-anchor="middle" fill="#d7e0ea" font-family="Montserrat, Arial, sans-serif" font-size="24">$29.99</text>
  <text x="815" y="612" text-anchor="middle" fill="#d7e0ea" font-family="Montserrat, Arial, sans-serif" font-size="24">$54.99</text>
  <text x="600" y="720" text-anchor="middle" fill="#f7f7f2" font-family="Syne, Arial, sans-serif" font-size="46" font-weight="700">Top five drains</text>
</svg>